<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 价格 · API 与订阅对比</title>
<style>
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --border:#e7e9ef;
  --text:#16181f;
  --muted:#5c6370;
  --faint:#8a92a0;
  --accent:#4f46e5;
  --accent-soft:#eef0ff;
  --usd:#0e9f6e; --usd-soft:#e7f7f0;
  --cny:#d97706; --cny-soft:#fdf0e0;
  --mid:#7c3aed; --mid-soft:#f1ebfd;
  --sub:#0e7490; --sub-soft:#e3f2f8;
  --blue:#0ea5e9;
  --point:#db2777; --point-soft:#fbe9f2;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:1280px;margin:0 auto;padding:0 24px}
a{color:var(--accent);text-decoration:none}

.site-header{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--faint)}
.nav{display:flex;gap:4px}
.nav a{padding:7px 14px;border-radius:999px;color:var(--muted);font-size:13.5px;font-weight:500}
.nav a:hover{background:var(--accent-soft);color:var(--accent)}

.hero{background:linear-gradient(180deg,#eef1ff 0%,var(--bg) 100%);border-bottom:1px solid var(--border);padding:52px 0 44px}
.hero h1{font-size:30px;line-height:1.25;margin:0 0 8px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--faint)}
.stat .v{font-size:22px;font-weight:750;margin-top:2px}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}

.section{padding:40px 0 8px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.section-head h2{font-size:21px;margin:0;letter-spacing:-.01em}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge-usd{background:var(--usd-soft);color:var(--usd)}
.badge-cny{background:var(--cny-soft);color:var(--cny)}
.tag{font-size:12px;color:var(--muted);font-weight:500}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
.table-wrap table{table-layout:fixed;min-width:860px}
thead th{background:#fafbfd;color:var(--faint);font-size:13px;font-weight:400;text-align:center;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
thead th.l{text-align:left}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfd}
td.l{text-align:left}
td.c{text-align:center}
.cell-strong{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.dash{color:#c3c8d2}
.m-usd{color:var(--usd);font-weight:600}
.m-cny{color:var(--cny);font-weight:600}
.m-mid{color:var(--mid);font-weight:600}
.m-sub{color:var(--sub);font-weight:650}
.m-point{color:var(--point);font-weight:600}
.m-blue{color:var(--blue);font-weight:600}
.cur{font-size:.9em;margin-right:2px;opacity:.85}
.num-p{white-space:nowrap;font-variant-numeric:tabular-nums}
.p-sym{display:inline-block;width:1.2em;text-align:left;opacity:.8;font-weight:700}
.p-int{display:inline-block;width:2.6em;text-align:right;font-weight:700}
.p-dec{display:inline-block;width:2.9em;font-size:.8em;text-align:left;font-weight:400}
.mini{font-size:12.5px;color:var(--faint)}
.tag{font-size:13px}
thead th.grp,tbody td.grp{border-left:1px solid var(--border)}
thead th.h-usd{color:var(--usd)}
thead th.h-cny{color:var(--cny)}
thead th.h-mid{color:var(--mid)}
thead th.h-point{color:var(--point)}
thead th.h-sub{color:var(--blue)}
.sub-best .m-blue{font-weight:800;text-decoration:underline;text-underline-offset:3px}

.vendor-block{margin-bottom:22px}
.vendor-head{display:flex;align-items:baseline;gap:12px;padding:0 2px 8px}
.vendor-name{font-size:17px;font-weight:750}
.vendor-weights{font-size:13px;color:var(--faint)}
.vendor-weights b{color:var(--muted)}

.plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.plan-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.plan-card .plan-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.plan-card .plan-name{font-size:16px;font-weight:750}
.plan-card table{font-size:13px;min-width:0}
.plan-card thead th{background:transparent;padding:8px 9px}
.plan-card tbody td{padding:8px 9px}
.plan-models{margin-top:10px;font-size:12px;color:var(--faint)}

.raw-section{display:grid;gap:16px}

@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .plan-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <span class="brand-mark">¥</span>
      <span class="brand-name">LLM 价格</span>
      <span class="brand-sub">API &amp; 订阅对比</span>
    </div>
    <nav class="nav">
      <a href="#compare">综合价</a>
      <a href="#plans">订阅方案</a>
      <a href="#raw">原始价格</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>各家大模型 API 与订阅价格对比</h1>
    <div class="stats" id="stats"></div>
  </div>
</section>

<main class="container">
  <section class="section" id="compare">
    <div class="section-head"><h2>综合价</h2></div>
    <div id="compareBox"></div>
  </section>

  <section class="section" id="plans">
    <div class="section-head"><h2>订阅方案</h2></div>
    <div class="plan-grid" id="plansBox"></div>
  </section>

  <section class="section" id="raw">
    <div class="section-head"><h2>原始价格</h2></div>
    <div class="raw-section" id="rawBox"></div>
  </section>
</main>

<script>
(async function main(){
let DATA;
try {
  const res = await fetch('llm-prices.json');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  DATA = await res.json();
} catch (e) {
  document.getElementById('stats').outerHTML =
    '<div class="stat" style="grid-column:1/-1"><div class="k">加载失败</div>' +
    '<div class="v" style="font-size:14px;font-weight:500;color:var(--muted)">无法读取 llm-prices.json，请通过本地 HTTP 服务打开本页（如 python -m http.server）</div></div>';
  return;
}
const USD_CNY = DATA.usd_to_cny;
const COMP = DATA.components || {};

const CHANNELS = {
  usd:               {label:"美元官方", cls:"usd"},
  cny:               {label:"人民币官方", cls:"cny"},
  packy_cc_sale:     {label:"中转站 cc-sale", cls:"mid"},
  packy_codex:       {label:"中转站 codex", cls:"mid"},
  packy_grok_sale:   {label:"中转站 grok-sale", cls:"mid"},
  packy_gemini_slb:  {label:"中转站 gemini-slb", cls:"mid"},
  glm_coding_points: {label:"GLM 积分系数", cls:"point"},
  opencode:          {label:"OpenCode", cls:"usd"},
};

function fmt(v, d){
  if (v == null) return '';
  if (typeof v !== 'number') return v;
  return String(Number(v.toFixed(d == null ? 4 : d)));
}
function curSign(u){ return u === 'USD' ? '$' : '¥'; }
// 价格按小数点对齐：币种符号槽 + 整数槽 + 固定宽度的小数块（小号字）
function price(v, cls, color){
  if (v == null) return '<span class="dash">—</span>';
  const sym = cls === 'usd' ? '$' : (cls === 'point' ? '' : '¥');
  let s = '<span class="num-p m-' + (color || cls) + '">';
  if (sym) s += '<span class="p-sym">' + sym + '</span>';
  let str = fmt(v);
  const d = str.indexOf('.');
  if (d < 0) str += '.00';
  else if (str.length - d - 1 === 1) str += '0';
  const dot = str.indexOf('.');
  s += '<span class="p-int">' + str.slice(0, dot) + '</span><span class="p-dec">.' + str.slice(dot + 1) + '</span>';
  return s + '</span>';
}
function resolvePrice(prices, key){
  if (prices[key] != null) return prices[key];
  if (key.indexOf('cache_write') === 0){
    if (prices.cache_write != null) return prices.cache_write;
    if (prices.input != null) return prices.input;
  }
  return 0;
}
function weightSum(prices, prov, chk){
  if (prices == null || prov == null) return null;
  const w = (chk != null && prov.channelWeights && prov.channelWeights[chk]) || prov.weights;
  if (w == null) return null;
  let sum = 0;
  for (const key in w) sum += resolvePrice(prices, key) * w[key];
  return sum;
}
function coefficientEffective(coef, plan){
  const f = k => plan.fee * coef[k] * 100 / plan.quota_monthly;
  return {input:f('input'), cache_hit:f('cache_hit'), output:f('output')};
}
// 中转站不区分条件：仅含中转站渠道的条件并入其他条件行，不单独成行
function normalizeConditions(conditions){
  const merged = [];
  const carry = {};
  for (const ck in conditions){
    const channels = conditions[ck];
    const chks = Object.keys(channels);
    if (chks.length > 0 && chks.every(c => c.indexOf('packy') === 0)){
      for (const c of chks) carry[c] = channels[c];
    } else {
      merged.push({ck:ck, channels:Object.assign({}, channels)});
    }
  }
  for (const item of merged){
    for (const c in carry) if (item.channels[c] == null) item.channels[c] = carry[c];
  }
  return merged;
}
function subscriptionPrices(mname, channels, prov, usd, cny){
  const out = [];
  for (const gname in DATA.subscriptions){
    const g = DATA.subscriptions[gname];
    if (g.models.indexOf(mname) < 0) continue;
    if (g.type === 'coefficient' && channels.glm_coding_points){
      const coef = channels.glm_coding_points;
      for (const pl in g.plans){
        const v = weightSum(coefficientEffective(coef, g.plans[pl]), prov, 'glm_coding_points');
        out.push({group:gname, plan:pl, value:v, currency:'CNY'});
      }
    } else if (g.type === 'money_quota' || g.type === 'credit'){
      const src = g.currency === 'USD' ? (channels.usd || channels.opencode) : channels.cny;
      if (src){
        // 订阅渠道可能有价格覆盖（如 Fable 5.1 缓存命中无优惠）
        const ov = (g.priceOverrides && g.priceOverrides[mname]) || {};
        const base = weightSum(Object.assign({}, src, ov), prov);
        for (const pl in g.plans){
          const p = g.plans[pl];
          const quotaMoney = g.type === 'credit' ? p.quota_monthly * g.credit_to_currency : p.quota_monthly;
          const v = base * p.fee / quotaMoney;
          out.push({group:gname, plan:pl, value:v, currency:g.currency});
        }
      }
    }
  }
  out.sort((a,b) => a.value - b.value);
  return out;
}

(function stats(){
  let modelCount = 0;
  for (const pn in DATA.providers) modelCount += Object.keys(DATA.providers[pn].models).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="k">汇率</div><div class="v">' + DATA.usd_to_cny + '<small>¥ / $</small></div></div>' +
    '<div class="stat"><div class="k">厂商</div><div class="v">' + Object.keys(DATA.providers).length + '</div></div>' +
    '<div class="stat"><div class="k">模型</div><div class="v">' + modelCount + '</div></div>' +
    '<div class="stat"><div class="k">订阅方案</div><div class="v">' + Object.keys(DATA.subscriptions).length + '</div></div>';
})();

/* 综合价主表：同模型跨行合并；中转站、订阅各档拆为独立列（只保留有值的列） */
(function compare(){
  const box = document.getElementById('compareBox');
  const out = [];
  for (const pname in DATA.providers){
    const prov = DATA.providers[pname];
    if (prov.weights == null) continue;
    const fmtW = w => Object.entries(w).map(([k,v]) => '<b>' + (COMP[k] || k) + '</b> ' + v).join(' · ');
    let wDesc = '权重 ' + fmtW(prov.weights);
    for (const chk in (prov.channelWeights || {})){
      const ci = CHANNELS[chk] || {label:chk};
      wDesc += '；' + ci.label + ' 权重 ' + fmtW(prov.channelWeights[chk]);
    }

    const groups = [], midSet = [];
    for (const mname in prov.models){
      const g = {mname:mname, rows:[]};
      for (const {ck, channels} of normalizeConditions(prov.models[mname])){
        const usd = channels.usd ? weightSum(channels.usd, prov, 'usd')
                   : channels.opencode ? weightSum(channels.opencode, prov, 'opencode') : null;
        let cny = channels.cny ? weightSum(channels.cny, prov, 'cny') : null;
        if (cny == null && usd != null) cny = usd * USD_CNY;
        const mids = {};
        for (const chk in channels) if (chk.indexOf('packy') === 0){
          mids[chk] = weightSum(channels[chk], prov, chk);
          if (midSet.indexOf(chk) < 0) midSet.push(chk);
        }
        const subs = {};
        let best = null;
        for (const s of subscriptionPrices(mname, channels, prov, usd, cny)){
          subs[s.group + '||' + s.plan] = s;
          if (best == null || s.value < best) best = s.value;
        }
        g.rows.push({ck:ck, usd:usd, cny:cny, mids:mids, subs:subs, best:best});
      }
      groups.push(g);
    }

    const vendorModels = Object.keys(prov.models);
    const subCols = [];
    for (const gname in DATA.subscriptions){
      const g = DATA.subscriptions[gname];
      if (!g.models.some(m => vendorModels.indexOf(m) >= 0)) continue;
      for (const pl in g.plans){
        if (groups.some(gr => gr.rows.some(r => r.subs[gname + '||' + pl]))) subCols.push({group:gname, plan:pl});
      }
    }

    const colDefs = [];
    midSet.forEach(chk => colDefs.push({kind:'mid', key:chk, label:(CHANNELS[chk] ? CHANNELS[chk].label.replace(/^中转站 /, '') : chk)}));
    let prevGroup = null;
    for (const sc of subCols){
      colDefs.push({kind:'sub', key:sc.group + '||' + sc.plan, label:sc.plan, group:sc.group, grp:sc.group !== prevGroup});
      prevGroup = sc.group;
    }
    if (colDefs.length) colDefs[0].grp = true;

    const hasCond = groups.some(gr => gr.rows.some(r => r.ck !== 'default'));
    // 模型（含条件）固定占 300px，无独立条件列时由模型列吸收，保证美元/人民币列跨表对齐
    const modelW = hasCond ? 200 : 300;
    let cg = '<col style="width:' + modelW + 'px">' + (hasCond ? '<col style="width:100px">' : '') + '<col style="width:150px"><col style="width:150px">';
    for (const cd of colDefs) cg += '<col>';
    let head = '<tr><th rowspan="2">模型</th>' + (hasCond ? '<th rowspan="2">条件</th>' : '') + '<th rowspan="2" class="h-usd">美元</th><th rowspan="2" class="h-cny">人民币</th>';
    if (midSet.length) head += '<th colspan="' + midSet.length + '" class="h-mid">中转站</th>';
    let gi = 0;
    while (gi < subCols.length){
      let gj = gi;
      while (gj < subCols.length && subCols[gj].group === subCols[gi].group) gj++;
      head += '<th colspan="' + (gj - gi) + '" class="h-sub">' + subCols[gi].group + '</th>';
      gi = gj;
    }
    head += '</tr><tr>';
    for (const cd of colDefs) head += '<th class="' + (cd.grp ? 'grp ' : '') + (cd.kind === 'mid' ? 'h-mid' : 'h-sub') + '">' + cd.label + '</th>';
    head += '</tr>';

    let body = '';
    for (const g of groups){
      g.rows.forEach((r, ri) => {
        body += '<tr>';
        if (ri === 0) body += '<td class="l cell-strong" rowspan="' + g.rows.length + '">' + g.mname + '</td>';
        if (hasCond) body += '<td class="c">' + (r.ck === 'default' ? '' : '<span class="tag">' + r.ck + '</span>') + '</td>';
        body += '<td class="num">' + price(r.usd, 'usd') + '</td>' +
          '<td class="num">' + price(r.cny, 'cny') + '</td>';
        for (const cd of colDefs){
          let inner;
          if (cd.kind === 'mid'){
            inner = price(r.mids[cd.key], 'mid');
          } else {
            const s = r.subs[cd.key];
            if (s){
              inner = price(s.value, s.currency === 'USD' ? 'usd' : 'cny', 'blue');
              if (subCols.length > 1 && s.value === r.best) inner = '<span class="sub-best">' + inner + '</span>';
            } else {
              inner = price(null, 'cny');
            }
          }
          body += '<td class="num' + (cd.grp ? ' grp' : '') + '">' + inner + '</td>';
        }
        body += '</tr>';
      });
    }
    out.push('<div class="vendor-block">');
    out.push('<div class="vendor-head"><span class="vendor-name">' + pname + '</span>' +
             '<span class="vendor-weights">' + wDesc + '</span></div>');
    out.push('<div class="table-wrap"><table><colgroup>' + cg + '</colgroup><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>');
  }
  box.innerHTML = out.join('');
})();

/* 订阅方案 */
(function plans(){
  const box = document.getElementById('plansBox');
  const out = [];
  const typeLabel = {money_quota:'额度制', credit:'积分制', coefficient:'积分系数制'};
  for (const gname in DATA.subscriptions){
    const g = DATA.subscriptions[gname];
    const unit = g.currency;
    const isMoney = g.type === 'money_quota';
    const hasWH = (Object.values(g.plans)[0] || {}).quota_weekly != null;
    let head = '<div class="plan-head"><span class="plan-name">' + gname + '</span>' +
      '<span class="badge ' + (unit === 'USD' ? 'badge-usd' : 'badge-cny') + '">' + curSign(unit) + '</span>' +
      '<span class="tag">' + (typeLabel[g.type] || g.type) + '</span></div>';
    let table = '<table><thead><tr><th class="l">套餐</th><th>月费</th>';
    if (hasWH) table += '<th>5h 额度</th><th>周额度</th>';
    table += '<th>月额度</th></tr></thead><tbody>';
    const quotaCell = v => isMoney
      ? '<span class="num">' + curSign(unit) + fmt(v) + '</span>'
      : '<span class="num">' + fmt(v) + ' <span class="mini">积分</span></span>';
    for (const pname in g.plans){
      const p = g.plans[pname];
      table += '<tr><td class="l cell-strong">' + pname + '</td>' +
        '<td class="num">' + curSign(unit) + fmt(p.fee) + '</td>';
      if (hasWH) table += '<td>' + quotaCell(p.quota_5h) + '</td><td>' + quotaCell(p.quota_weekly) + '</td>';
      table += '<td>' + quotaCell(p.quota_monthly) + '</td></tr>';
    }
    table += '</tbody></table>';
    let extra = g.type === 'credit' ? '<div class="plan-models">1 积分 = ' + curSign(unit) + g.credit_to_currency + ' · 适用：' + g.models.join('、') + '</div>'
                                   : '<div class="plan-models">适用：' + g.models.join('、') + '</div>';
    out.push('<div class="plan-card">' + head + table + extra + '</div>');
  }
  box.innerHTML = out.join('');
})();

/* 原始价格：渠道拆为列组（列头即渠道），同模型跨行合并，只保留实际存在的渠道与分量 */
(function raw(){
  const box = document.getElementById('rawBox');
  const out = [];
  const ORDER = ['input','cache_write','cache_write_5min','cache_write_30min','cache_write_1h','cache_hit','output'];
  const CHAN_ORDER = ['usd','cny','opencode','packy_cc_sale','packy_codex','packy_grok_sale','packy_gemini_slb','glm_coding_points'];
  for (const pname in DATA.providers){
    const prov = DATA.providers[pname];
    const chanSet = [], chanFields = {};
    for (const mname in prov.models){
      for (const {channels} of normalizeConditions(prov.models[mname])){
        for (const chk in channels){
          if (chanSet.indexOf(chk) < 0){ chanSet.push(chk); chanFields[chk] = new Set(); }
          const prices = channels[chk];
          for (const f in prices) if (prices[f] != null) chanFields[chk].add(f);
        }
      }
    }
    const chans = [];
    for (const c of CHAN_ORDER) if (chanSet.indexOf(c) >= 0) chans.push(c);
    for (const c of chanSet) if (chans.indexOf(c) < 0) chans.push(c);
    const chanCols = {};
    for (const chk of chans) chanCols[chk] = ORDER.filter(f => chanFields[chk].has(f));
    const hasCond = Object.values(prov.models).some(conds => normalizeConditions(conds).some(it => it.ck !== 'default'));

    const modelW = hasCond ? 200 : 300;
    let cg = '<col style="width:' + modelW + 'px">' + (hasCond ? '<col style="width:100px">' : '');
    for (const chk of chans) for (const f of chanCols[chk]) cg += '<col>';
    let head = '<tr><th rowspan="2">模型</th>' + (hasCond ? '<th rowspan="2">条件</th>' : '');
    for (const chk of chans){
      const ci = CHANNELS[chk] || {label:chk, cls:'cny'};
      head += '<th colspan="' + chanCols[chk].length + '" class="h-' + ci.cls + '">' + ci.label + '</th>';
    }
    head += '</tr><tr>';
    chans.forEach((chk, i) => {
      const ci = CHANNELS[chk] || {label:chk, cls:'cny'};
      for (const f of chanCols[chk]) head += '<th class="' + (i === 0 ? 'grp ' : '') + 'h-' + ci.cls + '">' + (COMP[f] || f) + '</th>';
    });
    head += '</tr>';

    let body = '';
    for (const mname in prov.models){
      const merged = normalizeConditions(prov.models[mname]);
      const condKeys = merged.map(it => it.ck);
      condKeys.forEach((ck, ci) => {
        const channels = merged[ci].channels;
        body += '<tr>';
        if (ci === 0) body += '<td class="l cell-strong" rowspan="' + condKeys.length + '">' + mname + '</td>';
        if (hasCond) body += '<td class="c">' + (ck === 'default' ? '' : '<span class="tag">' + ck + '</span>') + '</td>';
        chans.forEach((chk, i) => {
          const ci2 = CHANNELS[chk] || {label:chk, cls:'cny'};
          const prices = channels[chk];
          for (const f of chanCols[chk]){
            body += '<td class="num' + (i === 0 ? ' grp' : '') + '">' + price(prices ? prices[f] : null, ci2.cls) + '</td>';
          }
        });
        body += '</tr>';
      });
    }
    out.push('<div class="vendor-block"><div class="vendor-head"><span class="vendor-name">' + pname + '</span></div>' +
             '<div class="table-wrap"><table><colgroup>' + cg + '</colgroup><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>');
  }
  box.innerHTML = out.join('');
})();
})();
</script>
</body>
</html>
